# Netlify configuration for envint-web app

[build]
  publish = "apps/web/.next"
  command = "pnpm --filter @envint/web build && node -e \"const fs=require('fs');try{if(!fs.existsSync('.next'))fs.symlinkSync('apps/web/.next','.next','junction')}catch(e){}\""

[build.environment]
  NEXT_TELEMETRY_DISABLED = "1"
  NODE_VERSION = "24"
  SECRETS_SCAN_ENABLED = "false"

[functions]
  directory = "apps/web/netlify/functions"

# Hourly is deliberate for the Free plan. Editors can publish immediately;
# this poll exists only for content scheduled for a future time.
[functions."publish-scheduled"]
  schedule = "@hourly"

# Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Caching static assets
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
