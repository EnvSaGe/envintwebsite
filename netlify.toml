# Netlify root configuration for Envint monorepo (Public Web application)

[build]
  base = ""
  publish = "apps/web/.next"
  command = "pnpm --filter @envint/web build && node -e \"const fs=require('fs');try{if(!fs.existsSync('.next'))fs.symlinkSync('apps/web/.next','.next','junction')}catch(e){}\""

[build.environment]
  NEXT_TELEMETRY_DISABLED = "1"
  NODE_VERSION = "24"
  SECRETS_SCAN_ENABLED = "false"

[functions]
  directory = "apps/web/netlify/functions"

# Hourly scheduler for published/scheduled content
[functions."publish-scheduled"]
  schedule = "@hourly"

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Cache Next.js immutable static assets
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/_next/image*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=2592000"
