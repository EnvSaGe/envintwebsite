# Netlify root configuration for Envint monorepo (Public Web application)

[build]
  base = "apps/web"
  publish = ".next"
  command = "pnpm build"

[build.environment]
  NEXT_TELEMETRY_DISABLED = "1"
  NODE_VERSION = "20"
  PNPM_VERSION = "11.25.0"

[functions]
  directory = "netlify/functions"

# Hourly scheduler for published/scheduled content
[functions."publish-scheduled"]
  schedule = "@hourly"

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Cache Next.js immutable static assets
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
